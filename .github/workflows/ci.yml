name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration-and-e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voxmarket
          POSTGRES_PASSWORD: voxmarket
          POSTGRES_DB: voxmarket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voxmarket:voxmarket@localhost:5432/voxmarket_test
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
      DOWNLOAD_TOKEN_SECRET: ci-test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: VoxMarket
      ADMIN_EMAIL: admin@voxmarket.dev
      ADMIN_PASSWORD: Admin123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run db:seed:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
